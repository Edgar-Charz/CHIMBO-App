name: chimbo
description: "CHIMBO — B2B wholesale marketplace app for Tanzanian shop owners."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^4.0.2
  device_info_plus: ^13.2.0
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  skeletonizer: ^3.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  # Design pictures. Missing files show an icon placeholder (see assets/images/README.md).
  assets:
    - assets/images/brand/
    - assets/images/onboarding/
    - assets/images/auth/
    - assets/images/home/
    - assets/images/orders/

  # Poppins is bundled so text never depends on a network download (licence: assets/fonts/OFL.txt).
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
